#
# /etc/dhcp/dhcpd.conf
# IT 123 - Week 7: Configuring and Securing Network Services
# Student: Jhon Kenneth S. Aguilar (BSIT 4B)
#

# Global parameters
default-lease-time 600;
max-lease-time 7200;
authoritative;

# Subnet declaration for Small Office LAN (192.168.1.0/24)
subnet 192.168.1.0 netmask 255.255.255.0 {
    # Dynamic IP allocation pool (Part 2 & Part 6)
    range 192.168.1.160 192.168.1.170;
    
    # Network gateway
    option routers 192.168.1.1;
    option subnet-mask 255.255.255.0;
    option broadcast-address 192.168.1.255;
    
    # DNS configuration (Internal DNS first, fallback to public resolver)
    option domain-name-servers 192.168.1.150, 8.8.8.8, 8.8.4.4;
    option domain-name "company.local";
}
