#
# /etc/apache2/sites-available/company.local.conf
# VirtualHost configuration for company.local intranet
# IT 123 - Week 7 Laboratory
#

<VirtualHost *:80>
    ServerName www.company.local
    ServerAlias company.local
    ServerAdmin webmaster@company.local
    DocumentRoot /var/www/company.local

    ErrorLog ${APACHE_LOG_DIR}/company_local_error.log
    CustomLog ${APACHE_LOG_DIR}/company_local_access.log combined

    <Directory /var/www/company.local>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
