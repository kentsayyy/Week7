#
# /etc/vsftpd.conf
# IT 123 - Week 7: Configuring and Securing Network Services
# Hardened vsftpd configuration for Local LAN file sharing
# Student: Jhon Kenneth S. Aguilar (BSIT 4B)
#

# General Server Behavior
listen=YES
listen_ipv6=NO
listen_address=192.168.1.150
listen_port=21

# Access & Security Restrictions
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022

# Directory Chroot Jail (Containment)
chroot_local_user=YES
allow_writeable_chroot=YES

# Passive Mode Port Range (matching UFW Firewall configuration)
pasv_enable=YES
pasv_min_port=40000
pasv_max_port=40100
pasv_address=192.168.1.150

# Logging & Session Policies
dfl_max_rate=0
xferlog_enable=YES
xferlog_file=/var/log/vsftpd.log
idle_session_timeout=600
data_connection_timeout=120
pam_service_name=vsftpd
rsa_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem
rsa_private_key_file=/etc/ssl/private/ssl-cert-snakeoil.key
ssl_enable=NO
